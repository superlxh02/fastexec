<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" role="img" aria-labelledby="t4 d4">
  <title id="t4">work-sharing、worker-thread 与 task-stealing 三种并发模型</title>
  <desc id="d4">自上而下三行：第一行 work-sharing，所有线程始终从同一个全局队列取任务，队列是竞争热点；第二行 worker-thread，每个线程持有自己的队列，仅在自己队列为空时才访问全局队列；第三行 task-stealing，在 worker-thread 之上让空闲线程从积压队列搬走一半任务。</desc>
  <defs>
    <marker id="cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4263a2"/>
    </marker>
    <marker id="cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b15f29"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #17233b; }
      .title { font-size: 26px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; fill: #4b5c78; }
      .cell { font-size: 13px; }
      .box { stroke-width: 2; rx: 12; }
      .flow { fill: none; stroke: #4263a2; stroke-width: 2.2; }
      .dash { fill: none; stroke: #b15f29; stroke-width: 2.2; stroke-dasharray: 7 6; }
      .hot { fill: none; stroke: #b15f29; stroke-width: 2.4; }
    </style>
  </defs>

  <rect width="1240" height="920" fill="#f8faff"/>
  <text x="44" y="46" class="title">三种工作线程并发模型</text>

  <!-- ==================== ① work-sharing ==================== -->
  <rect x="44" y="76" width="1152" height="250" class="box" fill="#ffffff" stroke="#c3cede"/>
  <text x="68" y="110" class="head">① work-sharing：单一共享队列</text>
  <text x="68" y="134" class="tiny">任意线程都能取走队列中的任意任务。负载天然均衡，实现只需一把锁加一个容器；代价是队列成为全局热点，且任务落到哪个线程完全随机。</text>
  <rect x="88" y="156" width="150" height="46" class="box" fill="#e5edff" stroke="#7794d2"/><text x="163" y="184" class="small" text-anchor="middle">工作线程 0</text>
  <rect x="268" y="156" width="150" height="46" class="box" fill="#e5edff" stroke="#7794d2"/><text x="343" y="184" class="small" text-anchor="middle">工作线程 1</text>
  <rect x="448" y="156" width="150" height="46" class="box" fill="#e5edff" stroke="#7794d2"/><text x="523" y="184" class="small" text-anchor="middle">工作线程 2</text>
  <rect x="628" y="156" width="150" height="46" class="box" fill="#e5edff" stroke="#7794d2"/><text x="703" y="184" class="small" text-anchor="middle">工作线程 3</text>
  <path d="M 163 206 L 163 248" class="flow" marker-end="url(#cf)"/>
  <path d="M 343 206 L 343 248" class="flow" marker-end="url(#cf)"/>
  <path d="M 523 206 L 523 248" class="flow" marker-end="url(#cf)"/>
  <path d="M 703 206 L 703 248" class="flow" marker-end="url(#cf)"/>
  <text x="330" y="232" class="tiny" fill="#4263a2">每次取任务都要竞争同一把互斥锁</text>
  <rect x="88" y="252" width="690" height="48" class="box" fill="#fdf5ea" stroke="#d4a260"/>
  <text x="433" y="282" class="small" text-anchor="middle">全局任务队列</text>
  <text x="800" y="272" class="tiny">热点：所有线程的取、放都在这一把锁上排队；</text>
  <text x="800" y="292" class="tiny">队列所在缓存行在核间反复迁移。</text>

  <!-- ==================== ② worker-thread ==================== -->
  <rect x="44" y="346" width="1152" height="250" class="box" fill="#ffffff" stroke="#c3cede"/>
  <text x="68" y="380" class="head">② worker-thread：每线程一条队列</text>
  <text x="68" y="404" class="tiny">线程优先执行进入自己队列的任务，本地队列只有所属线程写入，取任务多数落在自己身上，不需要同步。失去的是均衡性：队列积压的线程无人分担，空闲线程只能干等。</text>
  <rect x="88" y="426" width="150" height="64" class="box" fill="#e4f4ed" stroke="#67a786"/>
  <text x="163" y="452" class="small" text-anchor="middle">工作线程 0</text>
  <text x="163" y="474" class="tiny" text-anchor="middle">本地队列</text>
  <rect x="268" y="426" width="150" height="64" class="box" fill="#e4f4ed" stroke="#67a786"/>
  <text x="343" y="452" class="small" text-anchor="middle">工作线程 1</text>
  <text x="343" y="474" class="tiny" text-anchor="middle">本地队列</text>
  <rect x="448" y="426" width="150" height="64" class="box" fill="#e4f4ed" stroke="#67a786"/>
  <text x="523" y="452" class="small" text-anchor="middle">工作线程 2</text>
  <text x="523" y="474" class="tiny" text-anchor="middle">本地队列</text>
  <rect x="628" y="426" width="150" height="64" class="box" fill="#e4f4ed" stroke="#67a786"/>
  <text x="703" y="452" class="small" text-anchor="middle">工作线程 3</text>
  <text x="703" y="474" class="tiny" text-anchor="middle">本地队列</text>
  <path d="M 163 492 L 163 528" class="dash" marker-end="url(#cd)"/>
  <path d="M 343 492 L 343 528" class="dash" marker-end="url(#cd)"/>
  <path d="M 523 492 L 523 528" class="dash" marker-end="url(#cd)"/>
  <path d="M 703 492 L 703 528" class="dash" marker-end="url(#cd)"/>
  <text x="330" y="514" class="tiny" fill="#b15f29">仅本地队列为空时才访问</text>
  <rect x="88" y="532" width="690" height="44" class="box" fill="#fdf5ea" stroke="#d4a260"/>
  <text x="433" y="560" class="small" text-anchor="middle">全局任务队列</text>
  <text x="800" y="548" class="tiny">热点被削平，但积压与空转无法互相调节：</text>
  <text x="800" y="568" class="tiny">线程 2 队列里排着任务，线程 0 无事可做。</text>

  <!-- ==================== ③ task-stealing ==================== -->
  <rect x="44" y="616" width="1152" height="284" class="box" fill="#ffffff" stroke="#c3cede"/>
  <text x="68" y="650" class="head">③ task-stealing：worker-thread + 窃取</text>
  <text x="68" y="674" class="tiny">保留 worker-thread 的局部性，再允许空闲线程从其他线程的队列搬走一半任务。拥有者从尾端弹出、窃取者从头端搬走，两条路径尽量不触碰同一个槽位。</text>

  <rect x="88" y="696" width="340" height="150" class="box" fill="#ffffff" stroke="#c3cede"/>
  <text x="108" y="726" class="small">线程 A：本地队列积压</text>
  <g>
    <rect x="108" y="744" width="46" height="42" fill="#e7efff" stroke="#829dcb"/><text x="131" y="771" class="cell" text-anchor="middle">T</text>
    <rect x="158" y="744" width="46" height="42" fill="#e7efff" stroke="#829dcb"/><text x="181" y="771" class="cell" text-anchor="middle">T</text>
    <rect x="208" y="744" width="46" height="42" fill="#e7efff" stroke="#829dcb"/><text x="231" y="771" class="cell" text-anchor="middle">T</text>
    <rect x="258" y="744" width="46" height="42" fill="#e7efff" stroke="#829dcb"/><text x="281" y="771" class="cell" text-anchor="middle">T</text>
    <rect x="308" y="744" width="46" height="42" fill="#e7efff" stroke="#829dcb"/><text x="331" y="771" class="cell" text-anchor="middle">T</text>
  </g>
  <text x="108" y="818" class="tiny">自己从 tail 端弹出最新的任务</text>
  <path d="M 108 830 L 108 806" class="flow" marker-end="url(#cf)"/>

  <rect x="592" y="696" width="340" height="150" class="box" fill="#ffffff" stroke="#c3cede"/>
  <text x="612" y="726" class="small">线程 B：本地队列为空</text>
  <g>
    <rect x="612" y="744" width="46" height="42" fill="#ffffff" stroke="#c3cede"/><text x="635" y="771" class="tiny" text-anchor="middle">空</text>
    <rect x="662" y="744" width="46" height="42" fill="#ffffff" stroke="#c3cede"/><text x="685" y="771" class="tiny" text-anchor="middle">空</text>
    <rect x="712" y="744" width="46" height="42" fill="#ffffff" stroke="#c3cede"/><text x="735" y="771" class="tiny" text-anchor="middle">空</text>
    <rect x="762" y="744" width="46" height="42" fill="#ffffff" stroke="#c3cede"/><text x="785" y="771" class="tiny" text-anchor="middle">空</text>
    <rect x="812" y="744" width="46" height="42" fill="#ffffff" stroke="#c3cede"/><text x="835" y="771" class="tiny" text-anchor="middle">空</text>
  </g>
  <text x="612" y="818" class="tiny">搬来的任务进入自己的队列，留一个立即执行</text>

  <path d="M 592 766 L 436 766" class="hot" marker-end="url(#cd)"/>
  <text x="514" y="742" class="tiny" text-anchor="middle" fill="#b15f29">窃取一半</text>
  <text x="514" y="792" class="tiny" text-anchor="middle" fill="#b15f29">从 steal 端</text>

  <text x="964" y="726" class="tiny">窃取只有在前三处来源</text>
  <text x="964" y="746" class="tiny">（私有队列、本地队列、</text>
  <text x="964" y="766" class="tiny">全局队列）都取不到任务</text>
  <text x="964" y="786" class="tiny">之后才发生，因此它不</text>
  <text x="964" y="806" class="tiny">参与常规取任务的竞争。</text>
  <text x="964" y="830" class="tiny">对应 <tspan font-family="DejaVu Sans Mono, monospace">Worker::task_steal</tspan>。</text>

  <text x="64" y="878" class="tiny">fastexec 在同一次运行中同时使用三者：外部提交进入全局队列（①），worker 内部提交进入本地队列或私有队列（②），本地与全局都为空时跨 worker 窃取（③）。</text>
</svg>
